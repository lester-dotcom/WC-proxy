<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatConverts Lead Analyser -- Pratt Digital</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; color: #2d3748; font-size: 13px; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .header { background: #4c565c; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  .config { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 14px 24px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .field label { font-size: 10px; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 5px; }
  .field input, .field select { border: 1px solid #e2e8f0; border-radius: 5px; padding: 8px 10px; font-size: 12px; color: #2d3748; background: #fff; outline: none; }
  .field input:focus, .field select:focus { border-color: #4c565c; box-shadow: 0 0 0 2px rgba(76,86,92,0.12); }
  .btn { border: none; border-radius: 5px; padding: 9px 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-slate { background: #4c565c; color: #fff; }
  .btn-slate:hover { background: #3a4248; }
  .btn-lime { background: #aec90b; color: #2d3748; }
  .btn-lime:hover { background: #9ab50a; }
  .btn:disabled { background: #cbd5e0; color: #718096; cursor: not-allowed; }
  .statusbar { padding: 7px 24px; font-size: 11px; color: #718096; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .statusbar.err { color: #c53030; background: #fff5f5; }
  .statusbar.ok  { color: #276749; background: #f0fff4; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .spinner { width: 13px; height: 13px; border: 2px solid #e2e8f0; border-top-color: #4c565c; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .main { flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
  .section { background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; }
  .section-hd { background: #4c565c; color: #fff; padding: 10px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; display: flex; justify-content: space-between; align-items: center; }
  .section-hd .note { font-weight: 400; font-size: 10px; opacity: 0.75; }
  .section-bd { padding: 16px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .kpi { background: #f8fafc; border-radius: 6px; padding: 14px; border-left: 3px solid #4c565c; }
  .kpi.lime  { border-left-color: #aec90b; }
  .kpi.amber { border-left-color: #f6ad55; }
  .kpi.red   { border-left-color: #fc8181; }
  .kpi-val   { font-size: 26px; font-weight: 700; color: #4c565c; line-height: 1; }
  .kpi-label { font-size: 10px; color: #718096; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-sub   { font-size: 11px; color: #a0aec0; margin-top: 3px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #f8fafc; color: #718096; font-weight: 600; text-align: left; padding: 8px 10px; border-bottom: 2px solid #e2e8f0; border-right: 1px solid #e9edf1; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 1px solid #f0f4f8; border-right: 1px solid #f0f4f8; vertical-align: middle; }
  th:last-child, td:last-child { border-right: none; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }
  td.num, th.num { text-align: right; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; }
  td.ctr, th.ctr { text-align: center; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
  .pill.g { background: #e6f4d7; color: #276749; }
  .pill.b { background: #d6e4f4; color: #1a4c7b; }
  .pill.a { background: #fff3d6; color: #7b5b00; }
  .pill.r { background: #fce4d6; color: #9b2c2c; }
  .pill.s { background: #f0f4f8; color: #4a5568; }
  .drop-alert { background: #fff5f5; border: 1px solid #fc8181; border-radius: 6px; padding: 12px 16px; font-size: 12px; color: #742a2a; }
  .drop-alert strong { color: #c53030; }
  .chart-row { display: flex; }
  .chart-axis { position: relative; width: 44px; flex-shrink: 0; height: 100px; margin-top: 10px; }
  .chart-axis-label { position: absolute; right: 6px; transform: translateY(50%); font-size: 9px; color: #a0aec0; white-space: nowrap; }
  .chart-scroll { flex: 1; min-width: 0; overflow-x: auto; padding-bottom: 6px; }
  .chart-plot { position: relative; }
  .chart-gridlines { position: absolute; left: 0; right: 0; top: 10px; height: 100px; pointer-events: none; }
  .chart-gridline { position: absolute; left: 0; right: 0; height: 1px; background: #eef1f4; }
  .chart-avg-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed #e53e3e; opacity: 0.7; }
  .chart-inner { display: flex; align-items: flex-end; gap: 4px; min-height: 130px; padding-top: 10px; position: relative; }
  .bar-grp { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 26px; max-width: 50px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 100px; }
  .bar { border-radius: 2px 2px 0 0; width: 11px; }
  .bar.t { background: #4c565c; }
  .bar.q { background: #aec90b; }
  .bar-lbl { font-size: 9px; color: #a0aec0; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  .legend { display: flex; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #718096; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; }
  .proxy-note { background: #fffbeb; border: 1px solid #f6e05e; border-radius: 6px; padding: 10px 14px; font-size: 11px; color: #744210; margin-bottom: 4px; }
  .empty { text-align: center; padding: 60px 20px; color: #a0aec0; }
  .tab-bar { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .tab-btn { border: 1px solid #e2e8f0; background: #fff; color: #4c565c; border-radius: 6px 6px 0 0; padding: 9px 18px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: none; }
  .tab-btn:hover { background: #f8fafc; }
  .tab-btn.active { background: #4c565c; color: #fff; }
  .tab-panel { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>WhatConverts Lead Analyser</h1>
  </div>

  <div class="config">
    <div class="field" style="min-width:280px">
      <label>Proxy URL (your Railway deployment)</label>
      <input type="text" id="proxyBase" value="https://wc-proxy-production.up.railway.app" placeholder="https://your-wc-proxy.up.railway.app" style="width:320px">
    </div>
    <div class="field" style="min-width:280px">
      <label>Ads Sheet CSV URL</label>
      <input type="text" id="adsSheetUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQuGxyRP78S2z4h5FbZ1BKETHGkL6cjASko-CA5CpmPFUWp7UaNiyXMek7j5VpA0HhId-PnJCfAxyU8/pub?gid=1974587501&single=true&output=csv" placeholder="Published Google Sheet CSV URL (optional)" style="width:320px">
    </div>
    <div class="field" style="min-width:200px">
      <label>Profile</label>
      <select id="profileSel" disabled style="width:220px"><option value="">-- load profiles first --</option></select>
    </div>
    <div class="field">
      <label>Date From</label>
      <input type="date" id="dateFrom" onchange="document.getElementById('quickRange').value=''" style="width:145px">
    </div>
    <div class="field">
      <label>Date To</label>
      <input type="date" id="dateTo" onchange="document.getElementById('quickRange').value=''" style="width:145px">
    </div>
    <div class="field">
      <label>Quick Range</label>
      <select id="quickRange" onchange="applyQuickRange(this.value)" style="width:150px">
        <option value="">Custom</option>
        <option value="last7">Last 7 Days</option>
        <option value="last30">Last 30 Days</option>
        <option value="thisMonth">This Month</option>
        <option value="lastMonth">Last Month</option>
        <option value="last3months">Last 3 Months</option>
        <option value="ytd">Year to Date</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end">
      <button class="btn btn-slate" onclick="loadProfiles()">Load Profiles</button>
      <button class="btn btn-lime" id="btnRun" onclick="runAnalysis()" disabled>Run Analysis</button>
    </div>
  </div>

  <div class="config" style="border-top:1px solid #e2e8f0">
    <div class="field" style="min-width:170px">
      <label>Source</label>
      <select id="sourceSel" disabled onchange="renderAnalysis()" style="width:170px"><option value="">All Sources</option></select>
    </div>
    <div class="field" style="min-width:170px">
      <label>Medium</label>
      <select id="mediumSel" disabled onchange="renderAnalysis()" style="width:170px"><option value="">All Mediums</option></select>
    </div>
  </div>

  <div class="statusbar" id="status"><div class="dot"></div> Enter your Railway proxy URL then load profiles</div>

  <div class="main" id="main">
    <div class="proxy-note">
      <strong>Setup:</strong> Deploy the <code>index.js</code> proxy to Railway with your WC_TOKEN and WC_SECRET environment variables, then paste the Railway URL above and click Load Profiles.
    </div>
    <div class="empty"><p>Waiting for proxy URL and profile selection.</p></div>
  </div>

</div>

<script>
// For "today-relative" ranges (quick presets, the initial default range):
// construct AND format using local getters/setters throughout. Mixing
// local construction with toISOString() (UTC-based) shifts the date back
// a day whenever the browser's timezone is ahead of UTC (e.g. BST) —
// that bug made "This Month"/"Last Month" open a day early.
function fmtLocalDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const today = new Date();
const d42 = new Date(); d42.setDate(today.getDate() - 42);
document.getElementById('dateTo').value   = fmtLocalDate(today);
document.getElementById('dateFrom').value = fmtLocalDate(d42);

// The proxy URL is pre-filled and this account has a single profile,
// so load it automatically instead of waiting for a manual click.
if (proxyBase()) { loadProfiles(); }

function applyQuickRange(preset) {
  if (!preset) return;
  const today = new Date();
  let from, to = new Date(today);
  if (preset==='last7') { from = new Date(today); from.setDate(from.getDate()-6); }
  else if (preset==='last30') { from = new Date(today); from.setDate(from.getDate()-29); }
  else if (preset==='thisMonth') { from = new Date(today.getFullYear(), today.getMonth(), 1); }
  else if (preset==='lastMonth') { from = new Date(today.getFullYear(), today.getMonth()-1, 1); to = new Date(today.getFullYear(), today.getMonth(), 0); }
  else if (preset==='last3months') { from = new Date(today); from.setMonth(from.getMonth()-3); from.setDate(from.getDate()+1); }
  else if (preset==='ytd') { from = new Date(today.getFullYear(), 0, 1); }
  document.getElementById('dateFrom').value = fmtLocalDate(from);
  document.getElementById('dateTo').value = fmtLocalDate(to);
  if (document.getElementById('profileSel').value) runAnalysis();
}

// dateFrom/dateTo here are plain "YYYY-MM-DD" strings from date <input>s, not
// tied to any particular moment — so this parses/formats in a fixed UTC frame
// throughout (Date.UTC + getUTC*/setUTC*), deliberately never touching local
// time or toISOString(), so it's correct regardless of the browser's timezone
// (unlike the local/UTC mixing bug fixed above in fmtLocalDate's callers).
function parseDateOnly(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d));
}
function fmtDateOnly(d) {
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}

// The immediately-preceding period of equal length to [dateFrom, dateTo],
// used as the actual "prior" comparison window — NOT half of the selected
// range. (Splitting the selected range in half was the old, wrong model:
// selecting "April" only showed half of April's totals as "recent".)
function priorPeriodBounds(dateFrom, dateTo) {
  const from = parseDateOnly(dateFrom), to = parseDateOnly(dateTo);
  const rangeDays = Math.round((to - from) / 86400000) + 1;
  const priorTo = new Date(from); priorTo.setUTCDate(priorTo.getUTCDate() - 1);
  const priorFrom = new Date(priorTo); priorFrom.setUTCDate(priorFrom.getUTCDate() - (rangeDays - 1));
  return { priorFrom: fmtDateOnly(priorFrom), priorTo: fmtDateOnly(priorTo) };
}

let currentLeads = [];
let currentAdsSpend = [];
let currentDateFrom = '';
let currentDateTo = '';
let chartMetric = 'total';
let chartGranularity = 'day';

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== '');
}

// Reads the daily keyword-level spend export (see ads-daily-spend-export.js)
// published from Google Sheets as CSV. Best-effort: a bad/missing URL just
// means no spend/ROAS data, not a failed analysis.
async function fetchAdsSpend(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Ads sheet fetch failed: ${res.status}`);
  const rows = parseCsv(await res.text());
  const header = rows[0] || [];
  const idx = name => header.indexOf(name);
  const i = {
    date: idx('Date'), campaignId: idx('Campaign ID'), campaignName: idx('Campaign Name'),
    adGroupId: idx('Ad Group ID'), adGroupName: idx('Ad Group Name'),
    keywordId: idx('Keyword ID'), keywordText: idx('Keyword Text'), matchType: idx('Match Type'),
    cost: idx('Cost'), clicks: idx('Clicks'), impressions: idx('Impressions'),
    conversions: idx('Conversions'), convValue: idx('Conv. Value')
  };
  return rows.slice(1).map(r => ({
    date: r[i.date],
    campaignId: r[i.campaignId],
    campaignName: r[i.campaignName],
    adGroupId: r[i.adGroupId],
    adGroupName: r[i.adGroupName],
    keywordId: r[i.keywordId],
    keywordText: r[i.keywordText],
    matchType: r[i.matchType],
    cost: Number(r[i.cost])||0,
    clicks: Number(r[i.clicks])||0,
    impressions: Number(r[i.impressions])||0,
    conversions: Number(r[i.conversions])||0,
    convValue: Number(r[i.convValue])||0
  }));
}

function splitAdsPeriods(adsRows, dateFrom, dateTo) {
  const { priorFrom, priorTo } = priorPeriodBounds(dateFrom, dateTo);
  const from = new Date(dateFrom).getTime();
  const to = new Date(dateTo).getTime() + 86399999; // include the full end day
  const pFrom = new Date(priorFrom).getTime();
  const pTo = new Date(priorTo).getTime() + 86399999;
  return {
    curr: adsRows.filter(r => { const t = new Date(r.date).getTime(); return t >= from && t <= to; }),
    prev: adsRows.filter(r => { const t = new Date(r.date).getTime(); return t >= pFrom && t <= pTo; })
  };
}

// Same shape as groupStats but for ads spend rows (cost/clicks only — ads
// data has no "quotable"/"sales" concept of its own, those come from the
// joined WhatConverts leads).
function groupAdsSpend(adsCurr, adsPrev, keyFn) {
  const stats = {};
  const ensure = k => stats[k] || (stats[k] = {spendCurr:0, spendPrev:0});
  adsCurr.forEach(r => { const k=keyFn(r); if(k==null) return; const s=ensure(k); s.spendCurr += r.cost; });
  adsPrev.forEach(r => { const k=keyFn(r); if(k==null) return; const s=ensure(k); s.spendPrev += r.cost; });
  return stats;
}

function applySpendToRow(row, spendStats) {
  const s = spendStats || {spendCurr:0, spendPrev:0};
  row.spendC = s.spendCurr;
  row.spendP = s.spendPrev;
  row.spendChange = s.spendCurr - s.spendPrev;
  row.roasC = s.spendCurr ? row.revC/s.spendCurr : null;
  row.roasP = s.spendPrev ? row.revP/s.spendPrev : null;
  return row;
}

function showCampaignLeads(encodedKey, encodedLabel) {
  const campaignId = decodeURIComponent(encodedKey);
  openLeadsWindow(lastRenderedLeads.filter(l => String(l.lead_campaign) === campaignId), decodeURIComponent(encodedLabel));
}

// Populated on each render so the drill-down links can look up which leads
// belong to the clicked row, and so the summary download reflects exactly
// what's on screen.
let lastRenderedLeads = [];
let lastSummaryData = null;

// Per-table sort state, keyed by the tableId passed to tbl(). Persists across
// re-renders (filter changes, chart metric switches) within the session.
let tableSortState = {};
// Per-table current page (0-indexed), for tables rendered with opts.paginate.
let tablePageState = {};
// The full (sorted, unpaginated) row data behind each tableId, refreshed on
// every render — export always pulls from here so it includes every row,
// not just whichever page is currently visible.
let tableExportData = {};
const TABLE_PAGE_SIZE = 10;
// Which top-level tab is showing. Persists across re-renders (sorting,
// pagination, filter changes) the same way tableSortState/tablePageState do.
let activeMainTab = 1;
function setMainTab(n) { activeMainTab = n; renderAnalysis(); }

function sortTable(tableId, colKey) {
  const state = tableSortState[tableId];
  if (state && state.colKey === colKey) {
    state.dir = state.dir === 'desc' ? 'asc' : 'desc';
  } else {
    tableSortState[tableId] = { colKey, dir: 'desc' };
  }
  tablePageState[tableId] = 0;
  renderAnalysis();
}

function setTablePage(tableId, page) {
  tablePageState[tableId] = page;
  renderAnalysis();
}

function exportButtonsHtml(tableId) {
  const btn = (fmt,label) => `<button onclick="exportTable('${tableId}','${fmt}')" style="border:none;border-radius:4px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;background:rgba(255,255,255,0.15);color:#fff">${label}</button>`;
  return `<span style="display:flex;gap:4px">${btn('csv','CSV')}${btn('xls','XLS')}</span>`;
}

function csvFromTable(data) {
  return [data.headers, ...data.rows].map(r => r.map(csvEscape).join(',')).join('\n');
}

function xmlEscape(v) {
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// A real Excel XML Spreadsheet ("SpreadsheetML", the Excel 2003 XML format) —
// unlike an HTML table saved with a .xls extension, Excel recognizes this
// format directly and opens it with no "file format doesn't match the
// extension" warning.
function xlsFromTable(data, sheetName) {
  const safeName = (sheetName||'Sheet1').replace(/[^A-Za-z0-9 _-]/g,'').slice(0,31) || 'Sheet1';
  const rowXml = cells => `<Row>${cells.map(c=>`<Cell><Data ss:Type="String">${xmlEscape(c)}</Data></Cell>`).join('')}</Row>`;
  const rowsXml = [data.headers, ...data.rows].map(rowXml).join('');
  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Worksheet ss:Name="${safeName}">
  <Table>${rowsXml}</Table>
 </Worksheet>
</Workbook>`;
}

function exportTable(tableId, format) {
  const data = tableExportData[tableId];
  if (!data) return;
  const filename = `${tableId}-${currentDateFrom}-to-${currentDateTo}`;
  const isCsv = format === 'csv';
  const blob = new Blob([isCsv ? csvFromTable(data) : xlsFromTable(data, tableId)], {type: isCsv ? 'text/csv' : 'application/vnd.ms-excel'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename + (isCsv ? '.csv' : '.xls');
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function csvEscape(v) {
  const s = String(v??'');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

// Column defs for the leads drill-down popup. "key" holds the raw value used
// for sorting; "display" (when present) is the formatted string shown/exported
// instead — needed for Sale, where sorting must compare the numeric amount but
// display the formatted currency.
const LEADS_POPUP_COLS = [
  { label: 'Date', key: 'date' },
  { label: 'Name', key: 'name' },
  { label: 'Email', key: 'email' },
  { label: 'Phone', key: 'phone' },
  { label: 'Type', key: 'type' },
  { label: 'Quotable', key: 'quotable' },
  { label: 'Sale', key: 'saleRaw', display: 'saleDisplay', numeric: true },
  { label: 'Source / Medium', key: 'sourceMedium' }
];

function leadsPopupRowsHtml(data) {
  return data.map(r => `<tr>${LEADS_POPUP_COLS.map(c => `<td>${r[c.display||c.key] ?? ''}</td>`).join('')}</tr>`).join('');
}

function leadsPopupCsvText(data) {
  const rows = [LEADS_POPUP_COLS.map(c=>c.label), ...data.map(r => LEADS_POPUP_COLS.map(c => r[c.display||c.key] ?? ''))];
  return rows.map(r => r.map(csvEscape).join(',')).join('\n');
}

function openLeadsWindow(matchingLeads, title) {
  const leadsData = matchingLeads
    .map(l => ({
      date: (l.date_created||l.lead_date||'').slice(0,10),
      name: l.contact_name||'',
      email: l.contact_email_address||l.email_address||'',
      phone: l.contact_phone_number||l.phone_number||'',
      type: l.lead_type||'',
      quotable: l.quotable||'',
      saleRaw: hasSalesValue(l) ? Number(l.sales_value) : null,
      saleDisplay: hasSalesValue(l) ? fmtCurrency(l.sales_value) : '',
      sourceMedium: `${l.lead_source||''} / ${l.lead_medium||''}`
    }))
    .sort((a,b) => new Date(b.date) - new Date(a.date));

  const fileSlug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'leads';
  const html = `<!DOCTYPE html><html><head><title>${title} — Leads</title><meta charset="UTF-8"><style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;padding:24px;color:#2d3748;background:#f4f5f7}
    h1{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .btn{border:none;border-radius:5px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;background:#aec90b;color:#2d3748}
    table{border-collapse:collapse;width:100%;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0}
    th{background:#f8fafc;color:#718096;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:2px solid #e2e8f0;border-right:1px solid #e9edf1;cursor:pointer;user-select:none}
    td{padding:7px 10px;border-bottom:1px solid #f0f4f8;border-right:1px solid #f0f4f8}
    th:last-child,td:last-child{border-right:none}
    tr:last-child td{border-bottom:none}
  </style></head><body>
    <h1><span>${title} — ${matchingLeads.length} lead${matchingLeads.length===1?'':'s'}</span><button class="btn" id="dl">Download CSV</button></h1>
    <table><thead><tr>${LEADS_POPUP_COLS.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
    <tbody>${leadsPopupRowsHtml(leadsData)}</tbody></table>
  </body></html>`;
  // Deliberately no inline script tag inside the html string above: its closing
  // tag text would be read by the browser's HTML parser as ending this page's
  // own outer script block, silently truncating the rest of the app's JS.
  // Instead we attach the sort/download handlers here once the popup (a
  // same-origin blob: URL) has loaded.
  const win = window.open(URL.createObjectURL(new Blob([html], {type: 'text/html'})), '_blank');
  if (win) {
    win.addEventListener('load', () => {
      const doc = win.document;
      const tbody = doc.querySelector('tbody');
      const ths = [...doc.querySelectorAll('th')];
      let currentData = leadsData;
      let sortState = null;

      ths.forEach((th, i) => {
        th.onclick = () => {
          if (sortState && sortState.colIdx === i) {
            sortState.dir = sortState.dir === 'desc' ? 'asc' : 'desc';
          } else {
            sortState = { colIdx: i, dir: 'desc' };
          }
          const c = LEADS_POPUP_COLS[i];
          currentData = leadsData.slice().sort((a,b) => {
            const av = a[c.key], bv = b[c.key];
            const cmp = c.numeric
              ? (av==null?-Infinity:av) - (bv==null?-Infinity:bv)
              : String(av??'').localeCompare(String(bv??''));
            return sortState.dir === 'asc' ? cmp : -cmp;
          });
          tbody.innerHTML = leadsPopupRowsHtml(currentData);
          ths.forEach((t,ti) => {
            const arrow = sortState.colIdx===ti ? (sortState.dir==='desc'?' ▼':' ▲') : '';
            t.textContent = LEADS_POPUP_COLS[ti].label + arrow;
          });
        };
      });

      const btn = doc.getElementById('dl');
      if (!btn) return;
      btn.onclick = () => {
        const a = doc.createElement('a');
        a.href = URL.createObjectURL(new Blob([leadsPopupCsvText(currentData)], {type: 'text/csv'}));
        a.download = fileSlug + '.csv';
        doc.body.appendChild(a);
        a.click();
        a.remove();
      };
    });
  }
}

// Row identity is passed as an encoded value rather than an array index,
// since sortable headers reorder rows and an index would point at the
// wrong row after sorting.
function showThemeLeads(encodedKey, encodedLabel) {
  const theme = decodeURIComponent(encodedKey);
  openLeadsWindow(lastRenderedLeads.filter(l => groupKeyword(l.lead_keyword) === theme), decodeURIComponent(encodedLabel));
}

function showKeywordLeads(encodedKey, encodedLabel) {
  const keyword = decodeURIComponent(encodedKey);
  openLeadsWindow(lastRenderedLeads.filter(l => (l.lead_keyword||'').toLowerCase().trim() === keyword), decodeURIComponent(encodedLabel));
}

function showSourceLeads(encodedKey, encodedLabel) {
  const [sLower,mLower] = decodeURIComponent(encodedKey).split('|');
  const matched = lastRenderedLeads.filter(l =>
    (l.lead_source||'(not set)').toLowerCase().trim() === sLower &&
    (l.lead_medium||'(not set)').toLowerCase().trim() === mLower
  );
  openLeadsWindow(matched, decodeURIComponent(encodedLabel));
}

// Strips query string/hash so pages are grouped by path, not by every
// distinct campaign/keyword querystring combination that landed on them.
function pagePath(url) {
  if (!url) return null;
  try { return new URL(url).pathname || '/'; }
  catch(e) { return url.split('?')[0].split('#')[0] || null; }
}

function showLandingPageLeads(encodedKey, encodedLabel) {
  const page = decodeURIComponent(encodedKey);
  openLeadsWindow(lastRenderedLeads.filter(l => pagePath(l.landing_url) === page), decodeURIComponent(encodedLabel));
}

function showPageValueLeads(encodedKey, encodedLabel) {
  const page = decodeURIComponent(encodedKey);
  openLeadsWindow(lastRenderedLeads.filter(l => pagePath(l.lead_url) === page), decodeURIComponent(encodedLabel));
}

function trendClause(curr, prior, fmt) {
  const f = fmt || (v=>v);
  if (prior === 0) return curr === 0 ? 'no change (both periods were flat)' : `up from ${f(0)} in the prior period`;
  const diff = curr - prior;
  if (diff === 0) return 'unchanged from the prior period';
  const pct = Math.round(Math.abs(diff)/prior*100);
  return `${diff>0?'up':'down'} ${pct}% from ${f(prior)} in the prior period`;
}

const CURRENCY_SYMBOL = '£';
function fmtCurrency(v) {
  return CURRENCY_SYMBOL + (Number(v)||0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function hasSalesValue(l) {
  return l.sales_value != null && l.sales_value !== '' && Number(l.sales_value) !== 0;
}

// Groups leads by keyFn and tallies lead count, quotable-yes count, and
// sales count/revenue for both the current and prior period in one pass,
// so every breakdown table can show Recent/Prior/Change for each metric.
function groupStats(curr, prev, keyFn) {
  const stats = {};
  const ensure = k => stats[k] || (stats[k] = {curr:0,prev:0,qCurr:0,qPrev:0,sCurr:0,sPrev:0,rCurr:0,rPrev:0});
  curr.forEach(l => {
    const k = keyFn(l); if (k==null) return;
    const s = ensure(k);
    s.curr++;
    if (l.quotable==='Yes') s.qCurr++;
    if (hasSalesValue(l)) { s.sCurr++; s.rCurr += Number(l.sales_value); }
  });
  prev.forEach(l => {
    const k = keyFn(l); if (k==null) return;
    const s = ensure(k);
    s.prev++;
    if (l.quotable==='Yes') s.qPrev++;
    if (hasSalesValue(l)) { s.sPrev++; s.rPrev += Number(l.sales_value); }
  });
  return stats;
}

function statsToRow(labelKey, label, s) {
  const bookC = s.curr ? Math.round(s.qCurr/s.curr*100) : 0;
  const bookP = s.prev ? Math.round(s.qPrev/s.prev*100) : 0;
  return {
    [labelKey]: label,
    curr: s.curr, prev: s.prev, change: s.curr-s.prev,
    bookC, bookP, bookChange: bookC-bookP,
    salesC: s.sCurr, salesP: s.sPrev, salesChange: s.sCurr-s.sPrev,
    revC: s.rCurr, revP: s.rPrev, revChange: s.rCurr-s.rPrev
  };
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = 'statusbar ' + (type||'');
  el.innerHTML = type === 'loading'
    ? `<div class="spinner"></div> ${msg}`
    : `<div class="dot"></div> ${msg}`;
}

function proxyBase() {
  return document.getElementById('proxyBase').value.replace(/\/$/, '');
}

async function apiFetch(path) {
  const url = proxyBase() + '/wc' + path;
  const r = await fetch(url);
  if (!r.ok) { const t = await r.text(); throw new Error(`${r.status}: ${t.slice(0,200)}`); }
  return r.json();
}

async function loadProfiles() {
  if (!proxyBase()) { setStatus('Enter your Railway proxy URL first', 'err'); return; }
  setStatus('Loading profiles...', 'loading');
  try {
    const accData = await apiFetch('/v1/accounts');
    const accounts = accData.accounts || accData;
    if (!accounts || !accounts.length) throw new Error('No accounts returned');

    const profiles = [];
    for (const acc of accounts) {
      const accId = acc.account_id || acc.id;
      const data = await apiFetch(`/v1/accounts/${accId}/profiles`);
      const accProfiles = data.profiles || data;
      (accProfiles || []).forEach(p => profiles.push({ ...p, account_name: acc.account_name || acc.name }));
    }
    if (!profiles.length) throw new Error('No profiles returned');
    const sel = document.getElementById('profileSel');
    sel.innerHTML = '';
    sel.disabled = false;
    profiles.forEach(p => {
      const o = document.createElement('option');
      o.value = p.profile_id || p.id;
      const label = (p.profile_name || p.name || 'Profile') + ' (' + (p.profile_id || p.id) + ')';
      o.textContent = accounts.length > 1 ? `${label} — ${p.account_name}` : label;
      sel.appendChild(o);
    });
    document.getElementById('btnRun').disabled = false;
    setStatus(`${profiles.length} profile(s) loaded`, 'ok');
  } catch(e) { setStatus('Error: ' + e.message, 'err'); }
}

async function fetchAllLeads(profileId, dateFrom, dateTo) {
  let page = 1, all = [];
  while (true) {
    const data = await apiFetch(`/v1/leads?profile_id=${profileId}&start_date=${dateFrom}&end_date=${dateTo}&page_number=${page}&leads_per_page=500`);
    const leads = data.leads || [];
    all = all.concat(leads);
    if (leads.length < 500) break;
    page++;
    setStatus(`Fetching... ${all.length} leads loaded`, 'loading');
  }
  return all;
}

// Groups values that only differ by case/whitespace, picking the most
// common casing as the display label (WhatConverts source/medium values
// are free text and get entered inconsistently, e.g. "CPC" vs "cpc").
function buildCanonicalMap(values) {
  const counts = {};
  values.forEach(v => {
    const val = (v || '(not set)').trim();
    const lower = val.toLowerCase();
    if (!counts[lower]) counts[lower] = {};
    counts[lower][val] = (counts[lower][val]||0) + 1;
  });
  const map = {};
  Object.keys(counts).forEach(lower => {
    const variants = counts[lower];
    map[lower] = Object.keys(variants).sort((a,b) => variants[b]-variants[a])[0];
  });
  return map;
}

function populateFilterOptions(leads) {
  const srcMap = buildCanonicalMap(leads.map(l => l.lead_source));
  const medMap = buildCanonicalMap(leads.map(l => l.lead_medium));
  const srcKeys = Object.keys(srcMap).sort((a,b) => srcMap[a].localeCompare(srcMap[b]));
  const medKeys = Object.keys(medMap).sort((a,b) => medMap[a].localeCompare(medMap[b]));
  const srcSel = document.getElementById('sourceSel');
  const medSel = document.getElementById('mediumSel');
  srcSel.innerHTML = '<option value="">All Sources</option>' + srcKeys.map(k => `<option value="${k}">${srcMap[k]}</option>`).join('');
  medSel.innerHTML = '<option value="">All Mediums</option>' + medKeys.map(k => `<option value="${k}">${medMap[k]}</option>`).join('');
  srcSel.disabled = false;
  medSel.disabled = false;
}

function groupKeyword(kw) {
  if (!kw) return null;
  const k = kw.toLowerCase().replace(/\+/g,' ').trim();
  if (/nyla|medispa|lee garrett/.test(k))    return 'Branded (Dr Nyla)';
  if (/ultherapy|ultracel|ultra therapy/.test(k)) return 'Ultherapy / Ultracel';
  if (/thread|threading/.test(k))            return 'Thread Lift';
  if (/fat|belly|stomach|body sculpt|emsculpt|aqualyx|loose skin/.test(k)) return 'Fat Reduction / Body Contouring';
  if (/morpheus|rf |radiofrequency|radio frequency|skin tight|sagging|neck tight|arm tight|turkey neck|jawline|non surgical face|non surgical skin|facelift|face lift|forehead|frown|wrinkle|tightening/.test(k)) return 'Skin Tightening / RF / Face Lift';
  if (/filler|rhinoplasty|lip |profhilo|polynucleotide|meso|injectable|botox/.test(k)) return 'Fillers / Injectables';
  if (/cellulite/.test(k)) return 'Cellulite';
  return 'Other';
}

// Cookie-consent blocking wipes out lead_campaign/lead_content/lead_keyword
// together but leaves lead_source/lead_medium/gclid intact (those come from
// the URL, not a cookie) — so a google/cpc lead with no campaign or keyword
// is still a real paid-search lead, just one WhatConverts couldn't attribute
// in detail. Bucketing these instead of dropping them keeps the Campaign
// Performance and keyword tables from silently losing real leads/revenue.
const NOT_TRACKED_LABEL = 'Not Tracked (Google CPC)';
function isGoogleCpc(l) {
  return (l.lead_source||'').toLowerCase().trim() === 'google' && (l.lead_medium||'').toLowerCase().trim() === 'cpc';
}
// Campaign Performance and both keyword tables now pair with Google Ads
// spend data, so a lead must actually be google/cpc to appear in them —
// otherwise a Facebook or GMB lead whose lead_campaign/lead_keyword field
// happens to be populated (with a Meta campaign name, an ad name, etc.)
// would show up mixed in with real Google Ads performance.
function campaignKey(l) {
  if (!isGoogleCpc(l)) return null;
  return l.lead_campaign || 'NOT_TRACKED_CPC';
}
function themeKey(l) {
  if (!isGoogleCpc(l)) return null;
  return l.lead_keyword ? groupKeyword(l.lead_keyword) : NOT_TRACKED_LABEL;
}
function rawKeywordKey(l) {
  if (!isGoogleCpc(l)) return null;
  return l.lead_keyword ? l.lead_keyword.toLowerCase().trim() : '(not tracked — google cpc)';
}

function countBy(leads, fn) {
  return leads.reduce((m,l) => { const k=fn(l); if(k!=null) m[k]=(m[k]||0)+1; return m; }, {});
}

function pill(text, cls) { return `<span class="pill ${cls}">${text}</span>`; }
function pctPill(p) { return pill(p+'%', p>=80?'g':p>=50?'b':p>=20?'a':'r'); }
function changePill(d, currency) {
  const n = Number(d);
  const abs = currency ? fmtCurrency(Math.abs(n)) : Math.abs(n);
  if (n>0) return pill('+'+abs,'g');
  if (n<0) return pill('-'+abs,'r');
  return pill(currency?fmtCurrency(0):'0','s');
}

function roasPill(v) {
  if (v == null) return pill('–','s');
  return pill(v.toFixed(2)+'x', v>=4?'g':v>=1?'b':'r');
}
// For period-over-period % change columns. null means the prior period was
// zero (no baseline to compute a % against), shown as "New" rather than a
// misleading +Infinity%.
function changePctPill(v) {
  if (v == null) return pill('New','g');
  const n = Number(v);
  if (n>0) return pill('+'+n+'%','g');
  if (n<0) return pill(n+'%','r');
  return pill('0%','s');
}
const sortNum = v => v==null || Number.isNaN(Number(v)) ? -Infinity : Number(v);

function cellExportValue(c, v) {
  if (c.roas) return v==null ? '' : v.toFixed(2)+'x';
  if (c.changePct) {
    if (v==null) return 'New';
    const n = Number(v);
    return (n>0?'+':n<0?'-':'') + Math.abs(n) + '%';
  }
  if (c.pct) return (v??0)+'%';
  if (c.change) {
    const n = Number(v);
    const sign = n>0 ? '+' : n<0 ? '-' : '';
    return sign + (c.currency ? fmtCurrency(Math.abs(n)) : Math.abs(n));
  }
  if (c.currency) return fmtCurrency(v);
  return v ?? '';
}

function tbl(rows, cols, opts) {
  opts = opts || {};
  const clsFor = c => (c.pct||c.change||c.changePct||c.roas) ? 'ctr' : c.num ? 'num' : '';

  const sortState = opts.tableId ? tableSortState[opts.tableId] : null;
  let displayRows = rows;
  if (sortState) {
    const col = cols.find(c => c.key === sortState.colKey);
    const numeric = col && (col.num || col.pct || col.change || col.changePct || col.roas);
    displayRows = rows.slice().sort((a,b) => {
      const av = a[sortState.colKey], bv = b[sortState.colKey];
      const cmp = numeric ? (sortNum(av)-sortNum(bv)) : String(av??'').localeCompare(String(bv??''));
      return sortState.dir === 'asc' ? cmp : -cmp;
    });
  }

  // Export always pulls the full sorted set, independent of pagination below.
  if (opts.tableId) {
    tableExportData[opts.tableId] = {
      headers: cols.map(c=>c.label),
      rows: displayRows.map(r => cols.map(c => cellExportValue(c, r[c.key])))
    };
  }

  let pageRows = displayRows;
  let paginationHtml = '';
  if (opts.paginate && opts.tableId) {
    const totalPages = Math.max(1, Math.ceil(displayRows.length / TABLE_PAGE_SIZE));
    let page = tablePageState[opts.tableId] || 0;
    if (page >= totalPages) page = totalPages - 1;
    if (page < 0) page = 0;
    tablePageState[opts.tableId] = page;
    pageRows = displayRows.slice(page*TABLE_PAGE_SIZE, page*TABLE_PAGE_SIZE + TABLE_PAGE_SIZE);
    if (totalPages > 1) {
      paginationHtml = `<div style="display:flex;align-items:center;justify-content:center;gap:12px;padding:10px;font-size:11px;color:#718096">
        <button onclick="setTablePage('${opts.tableId}',${page-1})" ${page===0?'disabled':''} style="border:1px solid #e2e8f0;background:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;color:#4c565c">‹ Prev</button>
        <span>Page ${page+1} of ${totalPages} (${displayRows.length} rows)</span>
        <button onclick="setTablePage('${opts.tableId}',${page+1})" ${page>=totalPages-1?'disabled':''} style="border:1px solid #e2e8f0;background:#fff;border-radius:4px;padding:4px 10px;cursor:pointer;color:#4c565c">Next ›</button>
      </div>`;
    }
  }

  const ths = cols.map(c => {
    if (!opts.tableId) return `<th class="${clsFor(c)}">${c.label}</th>`;
    const isSorted = sortState && sortState.colKey === c.key;
    const arrow = isSorted ? (sortState.dir === 'desc' ? ' ▼' : ' ▲') : '';
    return `<th class="${clsFor(c)}" onclick="sortTable('${opts.tableId}','${c.key}')" style="cursor:pointer;user-select:none">${c.label}${arrow}</th>`;
  }).join('');

  const trs = pageRows.map(r => {
    const tds = cols.map((c,ci) => {
      const v = r[c.key];
      let content;
      if (c.pct)    content = pctPill(Number(v));
      else if (c.changePct) content = changePctPill(v);
      else if (c.change) content = changePill(Number(v), c.currency);
      else if (c.roas)   content = roasPill(v);
      else if (c.num)    content = c.currency ? fmtCurrency(v) : v;
      else content = v??'';
      if (ci===0 && opts.rowClick) {
        const keyVal = opts.rowKeyFn ? opts.rowKeyFn(r) : v;
        content = `<a href="javascript:void(0)" onclick="${opts.rowClick}('${encodeURIComponent(keyVal)}','${encodeURIComponent(v)}')" style="color:#1a4c7b;text-decoration:underline;cursor:pointer">${content}</a>`;
      }
      return `<td class="${clsFor(c)}">${content}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>${paginationHtml}`;
}

// currentLeads spans [priorFrom, dateTo] (see runAnalysis), so the boundary
// between prior and current is simply dateFrom itself — no midpoint needed.
function splitPeriods(leads, dateFrom, dateTo) {
  const from = new Date(dateFrom).getTime();
  return {
    prev: leads.filter(l => new Date(l.date_created||l.lead_date).getTime() < from),
    curr: leads.filter(l => new Date(l.date_created||l.lead_date).getTime() >= from)
  };
}

function detectDrop(leads) {
  const bd = {};
  leads.forEach(l => {
    const d = (l.date_created||l.lead_date||'').slice(0,10);
    if (!d) return;
    if (!bd[d]) bd[d]={total:0,kw:0};
    bd[d].total++; if(l.lead_keyword) bd[d].kw++;
  });
  let wasHigh=false, drop=null;
  for (const d of Object.keys(bd).sort()) {
    const p = bd[d].total ? Math.round(bd[d].kw/bd[d].total*100) : 0;
    if (p>=70) wasHigh=true;
    if (wasHigh && p<50 && !drop) drop=d;
  }
  return drop;
}

const CHART_METRICS = {
  total:       { label: 'Total Leads' },
  quotableYes: { label: 'Quotable Yes' },
  bookingRate: { label: 'Booking Rate' },
  sales:       { label: 'Sales' },
  revenue:     { label: 'Revenue' },
  spend:       { label: 'Ad Spend' },
  roas:        { label: 'ROAS' }
};
const CHART_GRANULARITIES = { day: 'Daily', week: 'Weekly', month: 'Monthly' };

function setChartMetric(v) { chartMetric = v; renderAnalysis(); }
function setChartGranularity(v) { chartGranularity = v; renderAnalysis(); }

function chartMetricSelectHtml() {
  const metricOpts = Object.keys(CHART_METRICS).map(k =>
    `<option value="${k}"${k===chartMetric?' selected':''}>${CHART_METRICS[k].label}</option>`).join('');
  const granOpts = Object.keys(CHART_GRANULARITIES).map(k =>
    `<option value="${k}"${k===chartGranularity?' selected':''}>${CHART_GRANULARITIES[k]}</option>`).join('');
  return `<span style="display:flex;gap:6px">
    <select onchange="setChartGranularity(this.value)" style="font-size:11px;padding:4px 8px;border-radius:4px;border:none;">${granOpts}</select>
    <select onchange="setChartMetric(this.value)" style="font-size:11px;padding:4px 8px;border-radius:4px;border:none;">${metricOpts}</select>
  </span>`;
}

// Groups a date into a day/week/month bucket. Weeks start Monday; the bucket
// key is that Monday's date so bucket keys still sort correctly as strings.
function bucketKey(dateStr, granularity) {
  const d = parseDateOnly(dateStr.slice(0,10));
  if (granularity === 'month') return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
  if (granularity === 'week') {
    const day = d.getUTCDay();
    d.setUTCDate(d.getUTCDate() + (day===0 ? -6 : 1-day));
    return fmtDateOnly(d);
  }
  return dateStr.slice(0,10);
}
function bucketLabel(key, granularity) {
  if (granularity === 'month') {
    const [y,m] = key.split('-');
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m)-1] + ' ' + y.slice(2);
  }
  if (granularity === 'week') return 'Wk ' + key.slice(5);
  return key.slice(5);
}

// Picks a "nice" round gridline step (1/2/5/10 x a power of ten) for an axis
// topping out at maxVal, aiming for roughly targetSteps gridlines.
function niceStep(maxVal, targetSteps) {
  targetSteps = targetSteps || 4;
  if (maxVal <= 0) return 1;
  const rawStep = maxVal / targetSteps;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const residual = rawStep / magnitude;
  if (residual > 5) return 10 * magnitude;
  if (residual > 2) return 5 * magnitude;
  if (residual > 1) return 2 * magnitude;
  return magnitude;
}

function renderChart(leads, metric, adsRows, granularity) {
  const bd = {};
  const ensureBucket = k => bd[k] || (bd[k] = {total:0,quot:0,kw:0,sales:0,revenue:0,spend:0});
  leads.forEach(l => {
    const d = (l.date_created||l.lead_date||'').slice(0,10);
    if (!d) return;
    const b = ensureBucket(bucketKey(d, granularity));
    b.total++;
    if (l.quotable==='Yes') b.quot++;
    if (l.lead_keyword) b.kw++;
    if (hasSalesValue(l)) { b.sales++; b.revenue += Number(l.sales_value); }
  });
  (adsRows||[]).forEach(r => {
    if (!r.date) return;
    ensureBucket(bucketKey(r.date, granularity)).spend += r.cost;
  });
  const buckets = Object.keys(bd).sort();
  const label = CHART_METRICS[metric].label;

  const valueFor = k => {
    const b = bd[k];
    if (metric==='quotableYes') return b.quot;
    if (metric==='bookingRate') return b.total ? Math.round(b.quot/b.total*100) : 0;
    if (metric==='sales')       return b.sales;
    if (metric==='revenue')     return b.revenue;
    if (metric==='spend')       return b.spend;
    if (metric==='roas')        return b.spend ? b.revenue/b.spend : 0;
    return b.total;
  };
  const fmtVal = v => (metric==='revenue'||metric==='spend') ? fmtCurrency(v) : metric==='bookingRate' ? v+'%' : metric==='roas' ? v.toFixed(2)+'x' : v;
  const fmtAxisVal = v => {
    if (metric==='revenue'||metric==='spend') return v>=1000 ? CURRENCY_SYMBOL+(v/1000)+'k' : CURRENCY_SYMBOL+v;
    if (metric==='bookingRate') return v+'%';
    if (metric==='roas') return v.toFixed(1)+'x';
    return v>=1000 ? (v/1000)+'k' : String(v);
  };

  const avgVal = buckets.length ? buckets.reduce((s,k)=>s+valueFor(k),0)/buckets.length : 0;
  const rawMax = Math.max(...buckets.map(valueFor), avgVal, 1);
  const step = niceStep(rawMax);
  const niceMax = Math.max(Math.ceil(rawMax/step)*step, step);
  const gridlineCount = Math.round(niceMax/step);
  const gridVals = Array.from({length: gridlineCount+1}, (_,i) => i*step);
  const avgPx = Math.round(avgVal/niceMax*90);

  const bars = buckets.map(k => {
    const b = bd[k];
    const v = valueFor(k);
    const kwP = b.total ? Math.round(b.kw/b.total*100) : 0;
    const secondBar = metric==='total'
      ? `<div class="bar q" style="height:${Math.round((niceMax?b.quot/niceMax:0)*90)}px"></div>`
      : '';
    return `<div class="bar-grp" title="${bucketLabel(k,granularity)}: ${fmtVal(v)} ${label}, ${b.total} total leads, ${kwP}% keyword">
      <div class="bars">
        <div class="bar t" style="height:${Math.round(v/niceMax*90)}px"></div>
        ${secondBar}
      </div>
      <div class="bar-lbl">${bucketLabel(k,granularity)}</div>
    </div>`;
  }).join('');

  const axisHtml = gridVals.map(g => `<div class="chart-axis-label" style="bottom:${Math.round(g/niceMax*90)}px">${fmtAxisVal(g)}</div>`).join('');
  const gridlineHtml = gridVals.map(g => `<div class="chart-gridline" style="bottom:${Math.round(g/niceMax*90)}px"></div>`).join('');
  const avgLineHtml = `<div class="chart-avg-line" style="bottom:${avgPx}px" title="Average ${label}: ${fmtVal(avgVal)}"></div>`;

  return `<div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#4c565c"></div>${label}</div>
    ${metric==='total' ? '<div class="leg-item"><div class="leg-dot" style="background:#aec90b"></div>Quotable Yes</div>' : ''}
    <div class="leg-item"><div class="leg-dot" style="background:#e53e3e"></div>Average (${fmtVal(avgVal)})</div>
  </div>
  <div class="chart-row">
    <div class="chart-axis">${axisHtml}</div>
    <div class="chart-scroll"><div class="chart-plot">
      <div class="chart-gridlines">${gridlineHtml}${avgLineHtml}</div>
      <div class="chart-inner">${bars}</div>
    </div></div>
  </div>`;
}

function getFilteredLeads() {
  const src = document.getElementById('sourceSel').value;
  const med = document.getElementById('mediumSel').value;
  return currentLeads.filter(l =>
    (!src || (l.lead_source||'(not set)').toLowerCase().trim() === src) &&
    (!med || (l.lead_medium||'(not set)').toLowerCase().trim() === med)
  );
}

async function runAnalysis() {
  const profileId = document.getElementById('profileSel').value;
  const dateFrom  = document.getElementById('dateFrom').value;
  const dateTo    = document.getElementById('dateTo').value;
  if (!profileId||!dateFrom||!dateTo) { setStatus('Select a profile and date range','err'); return; }

  document.getElementById('btnRun').disabled = true;
  setStatus('Fetching leads...','loading');

  try {
    // Fetch from the start of the prior comparison period through dateTo in
    // one go, so "prior" is an actual equal-length preceding period rather
    // than the selected range split in half (which silently halved every
    // total shown for the range the user actually asked to see).
    const { priorFrom } = priorPeriodBounds(dateFrom, dateTo);
    const rawLeads = await fetchAllLeads(profileId, priorFrom, dateTo);
    currentLeads = rawLeads.filter(l => l.quotable !== 'Not Set');
    currentDateFrom = dateFrom;
    currentDateTo   = dateTo;

    // Default the chart to a granularity that won't dump hundreds of daily
    // bars on a long range (e.g. YTD) — the dropdown still lets the user
    // override this for the currently loaded data.
    const rangeDays = Math.round((parseDateOnly(dateTo) - parseDateOnly(dateFrom)) / 86400000) + 1;
    chartGranularity = rangeDays > 120 ? 'month' : rangeDays > 45 ? 'week' : 'day';
    populateFilterOptions(currentLeads);
    const excluded = rawLeads.length - currentLeads.length;

    // Ad spend is a bonus layer, not core to the analysis — a bad/missing
    // sheet URL shouldn't stop leads from rendering, just skip spend/ROAS.
    const adsSheetUrl = document.getElementById('adsSheetUrl').value.trim();
    currentAdsSpend = [];
    let adsError = '';
    if (adsSheetUrl) {
      try { currentAdsSpend = await fetchAdsSpend(adsSheetUrl); }
      catch(e) { adsError = ' (ad spend fetch failed: ' + e.message + ')'; console.error(e); }
    }

    setStatus(`${currentLeads.length} leads loaded (${excluded} excluded — quotable not set)${adsError}`, adsError?'err':'ok');
    renderAnalysis();
  } catch(e) {
    setStatus('Error: ' + e.message,'err');
    console.error(e);
  }
  document.getElementById('btnRun').disabled = false;
}

function renderAnalysis() {
  const leads = getFilteredLeads();
  const dateFrom = currentDateFrom, dateTo = currentDateTo;

  const {prev,curr} = splitPeriods(leads, dateFrom, dateTo);
  const { priorFrom, priorTo } = priorPeriodBounds(dateFrom, dateTo);
  const dropDate = detectDrop(curr);

  // Sales get recorded a median of ~19 days after the lead date (booking,
  // treatment, then invoicing all take time) — so revenue for any period
  // ending within the last few weeks is a lower bound, not final. Warn
  // whenever the selected range could still be affected.
  const REVENUE_LAG_DAYS = 21;
  const daysSinceRangeEnd = Math.round((parseDateOnly(fmtLocalDate(new Date())) - parseDateOnly(dateTo)) / 86400000);
  const revenueLagWarning = daysSinceRangeEnd < REVENUE_LAG_DAYS;

  const tc=curr.length, tp=prev.length;
  const qc=curr.filter(l=>l.quotable==='Yes').length, qp=prev.filter(l=>l.quotable==='Yes').length;
  const kc=curr.filter(l=>l.lead_keyword).length, kp=prev.filter(l=>l.lead_keyword).length;
  const kwPc=tc?Math.round(kc/tc*100):0, kwPp=tp?Math.round(kp/tp*100):0;
  const qPc=tc?Math.round(qc/tc*100):0, qPp=tp?Math.round(qp/tp*100):0;
  const sc=curr.filter(hasSalesValue).length, sp=prev.filter(hasSalesValue).length;
  const rc=curr.reduce((sum,l)=>sum+(hasSalesValue(l)?Number(l.sales_value):0),0);
  const rp=prev.reduce((sum,l)=>sum+(hasSalesValue(l)?Number(l.sales_value):0),0);

  const { curr: adsCurr, prev: adsPrev } = splitAdsPeriods(currentAdsSpend, dateFrom, dateTo);
  const spendC = adsCurr.reduce((sum,r)=>sum+r.cost,0);
  const spendP = adsPrev.reduce((sum,r)=>sum+r.cost,0);
  // ROAS should only weigh revenue the spend could plausibly have driven —
  // blending in organic/direct/Facebook revenue against Google Ads spend
  // would overstate it. isGoogleCpc catches tracked and untracked-but-still-
  // cpc leads alike (see campaignKey/themeKey above).
  const cpcRevC = curr.filter(isGoogleCpc).reduce((sum,l)=>sum+(hasSalesValue(l)?Number(l.sales_value):0),0);
  const cpcRevP = prev.filter(isGoogleCpc).reduce((sum,l)=>sum+(hasSalesValue(l)?Number(l.sales_value):0),0);
  const roasC = spendC ? cpcRevC/spendC : null;
  const roasP = spendP ? cpcRevP/spendP : null;

  // Mirrors the main Overview KPIs above, but scoped to google/cpc leads
  // only, for the PPC-focused Overview at the top of the Paid Search tab.
  const cpcCurr = curr.filter(isGoogleCpc), cpcPrev = prev.filter(isGoogleCpc);
  const ppcTc = cpcCurr.length, ppcTp = cpcPrev.length;
  const ppcQc = cpcCurr.filter(l=>l.quotable==='Yes').length, ppcQp = cpcPrev.filter(l=>l.quotable==='Yes').length;
  const ppcQPc = ppcTc?Math.round(ppcQc/ppcTc*100):0, ppcQPp = ppcTp?Math.round(ppcQp/ppcTp*100):0;
  const ppcKc = cpcCurr.filter(l=>l.lead_keyword).length, ppcKp = cpcPrev.filter(l=>l.lead_keyword).length;
  const ppcKwPc = ppcTc?Math.round(ppcKc/ppcTc*100):0, ppcKwPp = ppcTp?Math.round(ppcKp/ppcTp*100):0;
  const ppcSc = cpcCurr.filter(hasSalesValue).length, ppcSp = cpcPrev.filter(hasSalesValue).length;

  const quotRows = ['Yes','Pending','No'].map(v=>({
    status:v, curr:curr.filter(l=>l.quotable===v).length, prev:prev.filter(l=>l.quotable===v).length,
    change:curr.filter(l=>l.quotable===v).length-prev.filter(l=>l.quotable===v).length,
    pct:tc?Math.round(curr.filter(l=>l.quotable===v).length/tc*100):0
  }));

  const ltC=countBy(curr,l=>l.lead_type), ltP=countBy(prev,l=>l.lead_type);
  const ltQC=countBy(curr.filter(l=>l.quotable==='Yes'),l=>l.lead_type);
  const typeRows=Object.keys({...ltC,...ltP}).map(t=>{
    const c=ltC[t]||0, p=ltP[t]||0, booked=ltQC[t]||0;
    return {
      type:t, curr:c, prev:p, change:c-p,
      pctChange: p ? Math.round((c-p)/p*100) : (c>0?null:0),
      booked, bookRate: c?Math.round(booked/c*100):0
    };
  }).sort((a,b)=>b.curr-a.curr);

  const srcMap = buildCanonicalMap(leads.map(l => l.lead_source));
  const medMap = buildCanonicalMap(leads.map(l => l.lead_medium));
  const smKey = l => `${(l.lead_source||'(not set)').toLowerCase().trim()}|${(l.lead_medium||'(not set)').toLowerCase().trim()}`;
  const srcMedStats = groupStats(curr, prev, smKey);
  const sourceRows = Object.keys(srcMedStats).map(k => {
    const [sLower,mLower] = k.split('|');
    const row = statsToRow('source', `${srcMap[sLower]} / ${medMap[mLower]}`, srcMedStats[k]);
    row.rawKey = k;
    return row;
  }).sort((a,b)=>b.curr-a.curr);

  // Campaign ID is the reliable join key WhatConverts auto-tags into
  // lead_campaign for Google Ads leads (see ads-daily-spend-export.js) —
  // far less fragile than matching on free-text keyword content.
  const campNameMap = {};
  currentAdsSpend.forEach(r => { campNameMap[r.campaignId] = r.campaignName; });
  const campSpendStats = groupAdsSpend(adsCurr, adsPrev, r => r.campaignId);
  const campLeadStats = groupStats(curr, prev, campaignKey);
  const campaignIds = new Set([...Object.keys(campSpendStats), ...Object.keys(campLeadStats)]);
  const campaignRows = [...campaignIds].filter(id=>id).map(id => {
    const label = campNameMap[id] || (id==='NOT_TRACKED_CPC' ? NOT_TRACKED_LABEL : id);
    const row = statsToRow('campaign', label, campLeadStats[id] || {curr:0,prev:0,qCurr:0,qPrev:0,sCurr:0,sPrev:0,rCurr:0,rPrev:0});
    row.campaignId = id;
    return applySpendToRow(row, campSpendStats[id]);
  }).sort((a,b)=>b.spendC-a.spendC);

  // Keyword-text matching for the keyword-level tables: ads keywords with
  // spend but no matching WC lead are still included (0 leads / real
  // spend), so wasted-spend keywords surface via the Spend/ROAS columns
  // even if they never converted.
  const adsThemeStats = groupAdsSpend(adsCurr, adsPrev, r => groupKeyword(r.keywordText));
  const kwThemeStats = groupStats(curr, prev, themeKey);
  const themeKeys = new Set([...Object.keys(kwThemeStats), ...Object.keys(adsThemeStats)]);
  const kwThemeRows = [...themeKeys].filter(k=>k)
    .map(k => applySpendToRow(statsToRow('theme', k, kwThemeStats[k] || {curr:0,prev:0,qCurr:0,qPrev:0,sCurr:0,sPrev:0,rCurr:0,rPrev:0}), adsThemeStats[k]))
    .sort((a,b)=>b.curr-a.curr);

  const adsKwStats = groupAdsSpend(adsCurr, adsPrev, r => (r.keywordText||'').toLowerCase().trim());
  const rawKwStats = groupStats(curr, prev, rawKeywordKey);
  const rawKwKeys = new Set([...Object.keys(rawKwStats), ...Object.keys(adsKwStats)]);
  const rawKwRows = [...rawKwKeys].filter(k=>k&&k!=='undefined'&&k!=='null')
    .map(k => applySpendToRow(statsToRow('keyword', k, rawKwStats[k] || {curr:0,prev:0,qCurr:0,qPrev:0,sCurr:0,sPrev:0,rCurr:0,rPrev:0}), adsKwStats[k]))
    .sort((a,b)=>b.curr-a.curr);

  // Landing Pages: grouped by the page a visitor's session started on.
  // "Lands" counts every lead recorded against that page, including
  // WhatConverts-flagged duplicates (the page really was landed on either
  // way); Booked/Sales/Revenue exclude duplicates so revenue isn't
  // double-counted for repeat submissions from the same enquiry. There's no
  // separate "Leads" count here — with duplicates this rare it was always
  // equal to Lands, so Booking Rate/Sales % (both measured against Lands)
  // carry that signal instead.
  const landingStats = {};
  curr.forEach(l => {
    const p = pagePath(l.landing_url);
    if (!p) return;
    if (!landingStats[p]) landingStats[p] = {lands:0,booked:0,sales:0,revenue:0};
    const s = landingStats[p];
    s.lands++;
    if (!l.duplicate) {
      if (l.quotable==='Yes') s.booked++;
      if (hasSalesValue(l)) { s.sales++; s.revenue += Number(l.sales_value); }
    }
  });
  const landingRows = Object.keys(landingStats).map(p => {
    const s = landingStats[p];
    return {
      page:p, lands:s.lands, booked:s.booked,
      bookingRate: s.lands ? Math.round(s.booked/s.lands*100) : 0,
      sales:s.sales, salesPct: s.lands ? Math.round(s.sales/s.lands*100) : 0,
      revenue:s.revenue, revPerLand: s.lands ? s.revenue/s.lands : 0
    };
  }).sort((a,b)=>b.lands-a.lands);

  // Page Value: grouped by page. WhatConverts' leads API only records two
  // touchpoints per lead — the landing page (session start) and the lead
  // page (where the conversion happened) — it does not expose a full
  // page-view/session log, so there's no way to count every time a page
  // was seen during a visitor's journey. "Page Touches" is the closest
  // honest proxy: each lead counts once per page if that page was either
  // its landing page or its lead page (deduped if they're the same page),
  // so a page that was browsed but not converted on still shows up here.
  // Sales/Revenue stay attributed to the page the lead actually converted
  // on (lead_url), so Page Value reflects real conversion value per touch.
  const pageValueStats = {};
  curr.forEach(l => {
    const landP = pagePath(l.landing_url), leadP = pagePath(l.lead_url);
    new Set([landP, leadP].filter(Boolean)).forEach(p => {
      if (!pageValueStats[p]) pageValueStats[p] = {touches:0,sales:0,revenue:0};
      pageValueStats[p].touches++;
    });
    if (!l.duplicate && hasSalesValue(l) && leadP) {
      if (!pageValueStats[leadP]) pageValueStats[leadP] = {touches:0,sales:0,revenue:0};
      pageValueStats[leadP].sales++;
      pageValueStats[leadP].revenue += Number(l.sales_value);
    }
  });
  const pageValueRows = Object.keys(pageValueStats).map(p => {
    const s = pageValueStats[p];
    return { page:p, touches:s.touches, sales:s.sales, revenue:s.revenue, pageValue: s.touches ? s.revenue/s.touches : 0 };
  }).sort((a,b)=>b.touches-a.touches);

  // Drill-down and the day-by-day views should only reflect leads within the
  // selected range, not the extended fetch (which also covers the prior
  // comparison period).
  lastRenderedLeads = curr;

  const fC=countBy(curr,l=>l.form_name), fP=countBy(prev,l=>l.form_name);
  const fQC=countBy(curr.filter(l=>l.quotable==='Yes'),l=>l.form_name);
  const formRows=Object.keys({...fC,...fP}).filter(k=>k&&k!=='undefined').map(k=>{
    const c=fC[k]||0,p=fP[k]||0,diff=c-p,booked=fQC[k]||0;
    const st=c===0&&p>0?'Lost':c>0&&p===0?'New':diff<-2?'Declined':diff>2?'Increased':'Stable';
    return {form:k.length>50?k.slice(0,47)+'...':k,curr:c,prev:p,change:diff,
      booked, bookRate: c?Math.round(booked/c*100):0,
      status:st==='Lost'?pill('Lost','r'):st==='New'?pill('New','g'):st==='Declined'?pill('Declined','a'):st==='Increased'?pill('Increased','g'):pill('Stable','s')};
  }).sort((a,b)=>b.curr-a.curr);

  const bd={};
  curr.forEach(l=>{
    const d=(l.date_created||l.lead_date||'').slice(0,10); if(!d) return;
    if(!bd[d]) bd[d]={total:0,kw:0,quot:0};
    bd[d].total++; if(l.lead_keyword) bd[d].kw++; if(l.quotable==='Yes') bd[d].quot++;
  });
  const dateRows=Object.keys(bd).sort().map(d=>({
    date:d,total:bd[d].total,kw:bd[d].kw,noKw:bd[d].total-bd[d].kw,
    kwPct:bd[d].total?Math.round(bd[d].kw/bd[d].total*100):0,
    quot:bd[d].quot,qPct:bd[d].total?Math.round(bd[d].quot/bd[d].total*100):0
  }));

  lastSummaryData = { leads, curr, prev, dateFrom, dateTo, priorFrom, priorTo, tc, tp, qc, qp, qPc, qPp, kwPc, kwPp, kc, kp, sc, sp, rc, rp, cpcRevC, cpcRevP, spendC, spendP, roasC, roasP, kwThemeRows, sourceRows, campaignRows };

  const SPEND_ROAS_COLS = [
    {label:'Spend',key:'spendC',num:true,currency:true},
    {label:'Spend (Prior)',key:'spendP',num:true,currency:true},
    {label:'Spend Δ',key:'spendChange',change:true,currency:true},
    {label:'ROAS',key:'roasC',roas:true},
    {label:'ROAS (Prior)',key:'roasP',roas:true}
  ];

  const tabBtn = (n,label) => `<button class="tab-btn ${activeMainTab===n?'active':''}" onclick="setMainTab(${n})">${label}</button>`;
  const tabDisplay = n => activeMainTab===n ? '' : 'display:none';

  document.getElementById('main').innerHTML = `
    ${dropDate?`<div class="drop-alert">Keyword tracking drop detected: coverage fell below 50% from <strong>${dropDate}</strong>. Check the WhatConverts script and cookie consent settings around that date.</div>`:''}
    ${revenueLagWarning?`<div class="drop-alert">Revenue for this period is likely incomplete: sales are recorded a median of <strong>19 days</strong> after the lead date, and your selected range ends only ${daysSinceRangeEnd} day${daysSinceRangeEnd===1?'':'s'} ago. Revenue, Sales, and ROAS figures here will keep rising as more sales get logged over the next few weeks — treat them as a lower bound, not final.</div>`:''}
    <div class="tab-bar">
      ${tabBtn(1,'Overview & Traffic')}
      ${tabBtn(2,'Paid Search')}
      ${tabBtn(3,'Pages')}
      ${tabBtn(4,'Leads')}
    </div>

    <div class="tab-panel" style="${tabDisplay(1)}">
      <div class="section">
        <div class="section-hd">
          <span>Overview</span>
          <span class="note">Recent: ${dateFrom} to ${dateTo} / Prior: ${priorFrom} to ${priorTo}</span>
          <button class="btn btn-lime" style="padding:5px 12px;font-size:11px" onclick="downloadSummary()">Download Summary</button>
        </div>
        <div class="section-bd"><div class="kpi-grid">
          <div class="kpi"><div class="kpi-val">${tc}</div><div class="kpi-label">Total Leads (recent)</div><div class="kpi-sub">prior: ${tp}</div></div>
          <div class="kpi lime"><div class="kpi-val">${qc}</div><div class="kpi-label">Quotable Yes</div><div class="kpi-sub">prior: ${qp} &bull; ${qPc}% of total</div></div>
          <div class="kpi lime"><div class="kpi-val">${qPc}%</div><div class="kpi-label">Booking Rate</div><div class="kpi-sub">prior: ${qPp}%</div></div>
          <div class="kpi ${kwPc<50?'amber':''}"><div class="kpi-val">${kwPc}%</div><div class="kpi-label">Keyword Coverage</div><div class="kpi-sub">prior: ${kwPp}%</div></div>
          <div class="kpi ${kc===0?'red':''}"><div class="kpi-val">${kc}</div><div class="kpi-label">Leads With Keyword</div><div class="kpi-sub">prior: ${kp}</div></div>
          <div class="kpi"><div class="kpi-val">${sc}</div><div class="kpi-label">Sales</div><div class="kpi-sub">prior: ${sp}</div></div>
          <div class="kpi lime"><div class="kpi-val">${fmtCurrency(rc)}</div><div class="kpi-label">Revenue</div><div class="kpi-sub">prior: ${fmtCurrency(rp)}</div></div>
          <div class="kpi"><div class="kpi-val">${fmtCurrency(cpcRevC)}</div><div class="kpi-label">CPC Revenue</div><div class="kpi-sub">prior: ${fmtCurrency(cpcRevP)}</div></div>
          <div class="kpi"><div class="kpi-val">${fmtCurrency(spendC)}</div><div class="kpi-label">Ad Spend (Google Ads)</div><div class="kpi-sub">prior: ${fmtCurrency(spendP)}</div></div>
          <div class="kpi lime"><div class="kpi-val">${roasC!=null?roasC.toFixed(2)+'x':'–'}</div><div class="kpi-label">ROAS (CPC Revenue / Spend)</div><div class="kpi-sub">prior: ${roasP!=null?roasP.toFixed(2)+'x':'–'}</div></div>
        </div>
        <div style="font-size:10px;color:#a0aec0;font-style:italic;margin-top:10px">Note: sales are typically recorded a median of 19 days after the lead date, so revenue/sales figures for the last 2–3 weeks are usually incomplete and will rise as more sales get logged.</div>
        </div>
      </div>
      <div class="section"><div class="section-hd"><span>${CHART_GRANULARITIES[chartGranularity]} Lead Activity</span>${chartMetricSelectHtml()}</div><div class="section-bd">${renderChart(curr, chartMetric, adsCurr, chartGranularity)}</div></div>
      <div class="section"><div class="section-hd"><span>Traffic Source / Medium</span><span class="note">Click a row to view its leads &bull; click a header to sort</span>${exportButtonsHtml('source')}</div><div class="section-bd" style="overflow-x:auto">${tbl(sourceRows,[{label:'Source / Medium',key:'source'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'Booking %',key:'bookC',pct:true},{label:'Booking % (Prior)',key:'bookP',pct:true},{label:'Booking Δ (pp)',key:'bookChange',change:true},{label:'Sales',key:'salesC',num:true},{label:'Sales (Prior)',key:'salesP',num:true},{label:'Sales Δ',key:'salesChange',change:true},{label:'Revenue',key:'revC',num:true,currency:true},{label:'Revenue (Prior)',key:'revP',num:true,currency:true},{label:'Revenue Δ',key:'revChange',change:true,currency:true}], {rowClick:'showSourceLeads', rowKeyFn:r=>r.rawKey, tableId:'source', paginate:true})}</div></div>
    </div>

    <div class="tab-panel" style="${tabDisplay(2)}">
      <div class="section">
        <div class="section-hd">
          <span>PPC Overview</span>
          <span class="note">Google / CPC leads only &bull; Recent: ${dateFrom} to ${dateTo} / Prior: ${priorFrom} to ${priorTo}</span>
        </div>
        <div class="section-bd"><div class="kpi-grid">
          <div class="kpi"><div class="kpi-val">${ppcTc}</div><div class="kpi-label">Total Leads (recent)</div><div class="kpi-sub">prior: ${ppcTp}</div></div>
          <div class="kpi lime"><div class="kpi-val">${ppcQc}</div><div class="kpi-label">Quotable Yes</div><div class="kpi-sub">prior: ${ppcQp} &bull; ${ppcQPc}% of total</div></div>
          <div class="kpi lime"><div class="kpi-val">${ppcQPc}%</div><div class="kpi-label">Booking Rate</div><div class="kpi-sub">prior: ${ppcQPp}%</div></div>
          <div class="kpi ${ppcKwPc<50?'amber':''}"><div class="kpi-val">${ppcKwPc}%</div><div class="kpi-label">Keyword Coverage</div><div class="kpi-sub">prior: ${ppcKwPp}%</div></div>
          <div class="kpi ${ppcKc===0?'red':''}"><div class="kpi-val">${ppcKc}</div><div class="kpi-label">Leads With Keyword</div><div class="kpi-sub">prior: ${ppcKp}</div></div>
          <div class="kpi"><div class="kpi-val">${ppcSc}</div><div class="kpi-label">Sales</div><div class="kpi-sub">prior: ${ppcSp}</div></div>
          <div class="kpi lime"><div class="kpi-val">${fmtCurrency(cpcRevC)}</div><div class="kpi-label">Revenue</div><div class="kpi-sub">prior: ${fmtCurrency(cpcRevP)}</div></div>
          <div class="kpi"><div class="kpi-val">${fmtCurrency(spendC)}</div><div class="kpi-label">Ad Spend</div><div class="kpi-sub">prior: ${fmtCurrency(spendP)}</div></div>
          <div class="kpi lime"><div class="kpi-val">${roasC!=null?roasC.toFixed(2)+'x':'–'}</div><div class="kpi-label">ROAS</div><div class="kpi-sub">prior: ${roasP!=null?roasP.toFixed(2)+'x':'–'}</div></div>
        </div></div>
      </div>
      <div class="section"><div class="section-hd"><span>${CHART_GRANULARITIES[chartGranularity]} PPC Lead Activity</span>${chartMetricSelectHtml()}</div><div class="section-bd">${renderChart(cpcCurr, chartMetric, adsCurr, chartGranularity)}</div></div>
      <div class="section"><div class="section-hd"><span>Campaign Performance</span><span class="note">Click a campaign to view its leads &bull; click a header to sort &bull; requires the Ads Sheet CSV URL</span>${exportButtonsHtml('campaign')}</div><div class="section-bd" style="overflow-x:auto">${tbl(campaignRows,[{label:'Campaign',key:'campaign'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'Booking %',key:'bookC',pct:true},{label:'Booking % (Prior)',key:'bookP',pct:true},{label:'Booking Δ (pp)',key:'bookChange',change:true},{label:'Sales',key:'salesC',num:true},{label:'Sales (Prior)',key:'salesP',num:true},{label:'Sales Δ',key:'salesChange',change:true},{label:'Revenue',key:'revC',num:true,currency:true},{label:'Revenue (Prior)',key:'revP',num:true,currency:true},{label:'Revenue Δ',key:'revChange',change:true,currency:true}].concat(SPEND_ROAS_COLS), {rowClick:'showCampaignLeads', rowKeyFn:r=>r.campaignId, tableId:'campaign', paginate:true})}</div></div>
      <div class="section"><div class="section-hd"><span>Keyword Themes</span><span class="note">Click a theme to view its leads &bull; click a header to sort</span>${exportButtonsHtml('kwTheme')}</div><div class="section-bd" style="overflow-x:auto">${tbl(kwThemeRows,[{label:'Theme',key:'theme'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'Booking %',key:'bookC',pct:true},{label:'Booking % (Prior)',key:'bookP',pct:true},{label:'Booking Δ (pp)',key:'bookChange',change:true},{label:'Sales',key:'salesC',num:true},{label:'Sales (Prior)',key:'salesP',num:true},{label:'Sales Δ',key:'salesChange',change:true},{label:'Revenue',key:'revC',num:true,currency:true},{label:'Revenue (Prior)',key:'revP',num:true,currency:true},{label:'Revenue Δ',key:'revChange',change:true,currency:true}].concat(SPEND_ROAS_COLS), {rowClick:'showThemeLeads', tableId:'kwTheme', paginate:true})}</div></div>
      <div class="section"><div class="section-hd"><span>Raw Keywords</span><span class="note">Click a keyword to view its leads &bull; click a header to sort</span>${exportButtonsHtml('rawKw')}</div><div class="section-bd" style="overflow-x:auto">${tbl(rawKwRows,[{label:'Keyword',key:'keyword'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'Booking %',key:'bookC',pct:true},{label:'Booking % (Prior)',key:'bookP',pct:true},{label:'Booking Δ (pp)',key:'bookChange',change:true},{label:'Sales',key:'salesC',num:true},{label:'Sales (Prior)',key:'salesP',num:true},{label:'Sales Δ',key:'salesChange',change:true},{label:'Revenue',key:'revC',num:true,currency:true},{label:'Revenue (Prior)',key:'revP',num:true,currency:true},{label:'Revenue Δ',key:'revChange',change:true,currency:true}].concat(SPEND_ROAS_COLS), {rowClick:'showKeywordLeads', tableId:'rawKw', paginate:true})}</div></div>
      <div class="section"><div class="section-hd"><span>Keyword Coverage by Date</span>${exportButtonsHtml('kwByDate')}</div><div class="section-bd">${tbl(dateRows,[{label:'Date',key:'date'},{label:'Total',key:'total',num:true},{label:'With KW',key:'kw',num:true},{label:'No KW',key:'noKw',num:true},{label:'% KW',key:'kwPct',pct:true},{label:'Quotable Yes',key:'quot',num:true},{label:'% Quotable',key:'qPct',pct:true}], {tableId:'kwByDate'})}</div></div>
    </div>

    <div class="tab-panel" style="${tabDisplay(3)}">
      <div class="section"><div class="section-hd"><span>Landing Pages</span><span class="note">Click a page to view its leads &bull; click a header to sort &bull; grouped by page path (query strings stripped)</span>${exportButtonsHtml('landingPages')}</div><div class="section-bd" style="overflow-x:auto">${tbl(landingRows,[{label:'Page',key:'page'},{label:'Lands',key:'lands',num:true},{label:'Booked Leads',key:'booked',num:true},{label:'Booking Rate',key:'bookingRate',pct:true},{label:'Sales',key:'sales',num:true},{label:'Sales %',key:'salesPct',pct:true},{label:'Revenue',key:'revenue',num:true,currency:true},{label:'Revenue / Land',key:'revPerLand',num:true,currency:true}], {rowClick:'showLandingPageLeads', tableId:'landingPages', paginate:true})}</div></div>
      <div class="section"><div class="section-hd"><span>Page Value</span><span class="note">Click a page to view its leads &bull; click a header to sort</span>${exportButtonsHtml('pageValue')}</div><div class="section-bd" style="overflow-x:auto">
        <div class="proxy-note">"Page Touches" counts a page once per lead if it was that lead's landing page or conversion page. WhatConverts' API doesn't expose a full page-view/session log, so this can't capture every individual view within a visitor's journey (that would need a separate analytics source like GA4) — it's the closest available proxy, not raw traffic.</div>
        ${tbl(pageValueRows,[{label:'Page',key:'page'},{label:'Page Touches',key:'touches',num:true},{label:'Sales',key:'sales',num:true},{label:'Revenue',key:'revenue',num:true,currency:true},{label:'Page Value',key:'pageValue',num:true,currency:true}], {rowClick:'showPageValueLeads', tableId:'pageValue', paginate:true})}
      </div></div>
    </div>

    <div class="tab-panel" style="${tabDisplay(4)}">
      <div class="two-col">
        <div class="section"><div class="section-hd"><span>Quotable Breakdown</span>${exportButtonsHtml('quotable')}</div><div class="section-bd">${tbl(quotRows,[{label:'Status',key:'status'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'% of Total',key:'pct',pct:true}], {tableId:'quotable'})}</div></div>
        <div class="section"><div class="section-hd"><span>Lead Type</span>${exportButtonsHtml('leadType')}</div><div class="section-bd">${tbl(typeRows,[{label:'Type',key:'type'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'% Change',key:'pctChange',changePct:true},{label:'Booked Leads',key:'booked',num:true},{label:'Booking %',key:'bookRate',pct:true}], {tableId:'leadType'})}</div></div>
      </div>
      <div class="section"><div class="section-hd"><span>Form Names</span>${exportButtonsHtml('formNames')}</div><div class="section-bd">${tbl(formRows,[{label:'Form',key:'form'},{label:'Total Leads Recent',key:'curr',num:true},{label:'Total Leads Prior',key:'prev',num:true},{label:'Change',key:'change',change:true},{label:'Booked Leads',key:'booked',num:true},{label:'Booking %',key:'bookRate',pct:true},{label:'Status',key:'status'}], {tableId:'formNames'})}</div></div>
    </div>
  `;
}
</script>
</body>
</html>
